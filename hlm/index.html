  { source:"贾瑞",       target:"王熙凤",     type:"痴恋", style:"dotted" },

  { source:"薛宝钗",       target:"蕊官",     type:"主仆", style:"dashed" },

  { source:"冷子兴",     target:"周瑞家的",   type:"女婿", style:"solid" },
  { source:"赖嬷嬷",     target:"赖大",       type:"母子", style:"solid" },
  { source:"赖嬷嬷",     target:"贾母",       type:"老仆", style:"dashed" },
  { source:"王善保家的", target:"邢夫人",     type:"陪房", style:"dashed" },
  { source:"王善保家的", target:"司棋",       type:"祖孙", style:"solid" },
  { source:"贾琏",       target:"兴儿",       type:"主仆", style:"dashed" },
  { source:"刘姥姥",     target:"板儿",       type:"祖孙", style:"solid" },
  { source:"板儿",       target:"巧姐",       type:"姻缘", style:"dotted" },

// ============================================================
// 图谱构建
// ============================================================

const svg = d3.select("#graph");
const width = window.innerWidth;
const height = window.innerHeight;
svg.attr("viewBox", [0, 0, width, height]);

// 缩放行为
const g = svg.append("g");
svg.call(d3.zoom()
  .scaleExtent([0.25, 4])
  .on("zoom", (event) => {
    g.attr("transform", event.transform);
  }));

// 分类初始中心 — 荣宁二府相邻（同宗），其余家族环布四周
const catCenters = {
  rong:  { x: width*0.30, y: height*0.42 },   // 左中（荣国府最大）
  ning:  { x: width*0.48, y: height*0.32 },   // 荣右侧（宁国府，同宗相邻）
  wang:  { x: width*0.08, y: height*0.20 },   // 左上角（王家）
  shi:   { x: width*0.35, y: height*0.14 },   // 顶部（史家，在荣宁上方）
  xue:   { x: width*0.78, y: height*0.60 },   // 右下角（薛家）
  lin:   { x: width*0.12, y: height*0.65 },   // 左下角（林家）
  other: { x: width*0.52, y: height*0.60 },   // 底部（僧道/外围）
};

// 为节点添加初始坐标（家族内随机散布，大族散布半径更大）
nodes.forEach(n => {
  const c = catCenters[n.cat] || catCenters.other;
  const spread = n.cat === "rong" ? 180 : n.cat === "other" ? 150 : 100;
  n.x = c.x + (Math.random() - 0.5) * spread * 2;
  n.y = c.y + (Math.random() - 0.5) * spread * 2;
});

// 计算每个节点的关联数（度数），度数越高节点越大
nodes.forEach(n => { n.degree = 0; });
links.forEach(l => {
  const sid = typeof l.source === "string" ? l.source : l.source?.id || l.source;
  const tid = typeof l.target === "string" ? l.target : l.target?.id || l.target;
  const sn = nodes.find(n => n.id === sid);
  const tn = nodes.find(n => n.id === tid);
  if (sn) sn.degree++;
  if (tn) tn.degree++;
});

// 节点半径计算（基础 + 关系数加权）
function nodeRadius(d) {
  let base;
  if (d.tb === "正册") base = 13;
  else if (d.tb === "副册") base = 10;
  else if (d.tb === "又副册") base = 8;
  else if (["贾宝玉","贾母","贾政","王熙凤"].includes(d.id)) base = 11;
  else base = d.gender === "male" ? 9 : 8;
  // 按度数加权，每 5 条关系 +1px，上限 +6
  const bonus = Math.min((d.degree || 0) * 0.5, 6);
  return base + bonus;
}

// 力模拟
const simulation = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(d => {
    const distMap = { "夫妻":50, "夫妾":55, "通房":55, "父子":60, "父女":60, "母子":60, "母女":60,
                      "兄弟":75, "兄妹":75, "姐弟":60, "姐妹":75, "结拜兄弟":75, "叔侄":80, "姑侄":80, "堂姐妹":85,
                      "主仆":90, "管家":95, "陪房":95, "老仆":100, "救主旧仆":105,
                      "知己·木石前盟":60, "金玉良缘":60, "知己":60, "挚友":60, "好友":65, "亲密":70, "相知":75,
                      "未婚夫妻":60, "私情":60, "情侣":60, "情深":60, "姻缘":65,
                      "点化":90, "道友":70, "仙界同道":75,
                      "启蒙老师":80, "知遇之恩":80, "同僚提携":85,
                      "投亲":85, "恩人":75, "投缘":80, "姑祖母":85,
                      "族侄":80, "义父子":80, "女婿":80, "祖孙":65, "痴恋":70 };
    return distMap[d.type] || 100;
  }).strength(0.5))
  .force("charge", d3.forceManyBody().strength(-320))
  .force("center", d3.forceCenter(width/2, height/2))
  .force("collide", d3.forceCollide(d => nodeRadius(d) + 12))
  .force("x", d3.forceX(d => (catCenters[d.cat] || catCenters.other).x).strength(0.12))
  .force("y", d3.forceY(d => (catCenters[d.cat] || catCenters.other).y).strength(0.12));

// 预热：跑 400 步让布局充分展开，减少交叉线
simulation.stop();
for (let i = 0; i < 400; i++) simulation.tick();
// 快速冷却，收尾时几乎无感知
simulation.alphaDecay(0.08);

// ---- 连线 ----
const linkGroup = g.append("g").attr("class", "links");

// 核心关系常驻显示，次要关系悬停时才显示
// 所有关系标签默认隐藏，仅在悬停连线或高亮节点时显示
const linkLabel = linkGroup.selectAll("text")
  .data(links)
  .join("text")
  .attr("class", "link-label")
  .text(d => d.type)
  .style("opacity", 0);

// 隐形宽线：14px 宽透明线用作鼠标命中区，解决细线难以瞄准的问题
const linkHit = linkGroup.selectAll("line.link-hit")
  .data(links)
  .join("line")
  .attr("class", "link-hit")
  .attr("stroke", "transparent")
  .attr("stroke-width", 14)
  .on("mouseenter", function(event, d) {
    link.filter(ld => ld === d)
      .attr("stroke", "#8b0000")
      .attr("opacity", 1);
    linkLabel.filter(ld => ld === d).style("opacity", 1);
  })
  .on("mouseleave", function(event, d) {
    link.filter(ld => ld === d)
      .attr("stroke", d.style === "dashed" ? "#b8a590" : d.style === "dotted" ? "#c4a882" : "#b8a590")
      .attr("opacity", d.style === "dotted" ? 0.55 : d.style === "dashed" ? 0.45 : 0.5);
    // 若该连线被节点高亮标记，则不隐藏标签
    const keep = link.filter(ld => ld === d).classed("highlighted");
    if (!keep) linkLabel.filter(ld => ld === d).style("opacity", 0);
  });

// 可见线：不响应鼠标事件，由上方隐形线代理
const link = linkGroup.selectAll("line.link-visible")
  .data(links)
  .join("line")
  .attr("class", "link")
  .attr("stroke", d => {
    if (d.style === "dashed") return "#b8a590";
    if (d.style === "dotted") return "#c4a882";
    return "#b8a590";
  })
  .attr("stroke-width", d => {
    if (d.type === "夫妻") return 2.2;
    if (d.type === "知己·木石前盟" || d.type === "金玉良缘") return 2;
    if (d.style === "dashed") return 1.2;
    return 1.5;
  })
  .attr("stroke-dasharray", d => {
    if (d.style === "dashed") return "6,3";
    if (d.style === "dotted") return "3,4";
    return null;
  })
  .attr("opacity", d => {
    if (d.style === "dotted") return 0.55;
    if (d.style === "dashed") return 0.45;
    return 0.5;
  })
  .style("pointer-events", "none");

// ---- 节点 ----
const nodeGroup = g.append("g").attr("class", "nodes");

const node = nodeGroup.selectAll("g")
  .data(nodes)
  .join("g")
  .attr("class", "node")
  .call(d3.drag()
    .on("start", (event, d) => {
      if (!event.active) simulation.alphaTarget(0.3).restart();
      d.fx = d.x;
      d.fy = d.y;
    })
    .on("drag", (event, d) => {
      // 限制拖拽范围在画布内
      d.fx = Math.max(40, Math.min(width - 40, event.x));
      d.fy = Math.max(40, Math.min(height - 40, event.y));
    })
    .on("end", (event, d) => {
      // 松手即停，不残留任何运动
      simulation.stop();
      d.fx = null;
      d.fy = null;
    }));

// 节点圆
node.append("circle")
  .attr("r", d => nodeRadius(d))
  .attr("fill", d => {
    const base = categoryColors[d.cat];
    // 男性稍深，女性稍亮
    return d.gender === "male" ? d3.color(base).darker(0.3) : base;
  })
  .attr("stroke", d => {
    if (d.tb === "正册") return "#d4a017";
    if (d.tb === "副册") return "#a07848";
    if (d.tb === "又副册") return "#8b5e4b";
    return d3.color(categoryColors[d.cat]).darker(0.5);
  })
  .attr("stroke-width", d => {
    if (d.tb === "正册") return 3;
    if (d.tb === "副册") return 2.5;
    if (d.tb === "又副册") return 2;
    return 1.5;
  })
  .attr("cursor", "pointer")
  .on("mouseenter", handleMouseEnter)
  .on("mouseleave", handleMouseLeave)
  .on("click", handleNodeClick);

// 节点标签
node.append("text")
  .attr("class", "node-label")
  .attr("dy", d => -nodeRadius(d) - 5)
  .text(d => d.id)
  .style("font-weight", d => d.tb === "正册" ? "bold" : "normal")
  .style("font-size", d => {
    if (d.tb === "正册") return "13px";
    if (d.tb === "副册") return "11px";
    return "10px";
  })
  .style("fill", d => d.tb === "正册" ? "#8b0000" : "#4a3525");

// 位置更新函数
function updatePositions() {
  linkHit
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x)
    .attr("y2", d => d.target.y);

  link
    .attr("x1", d => d.source.x)
    .attr("y1", d => d.source.y)
    .attr("x2", d => d.target.x)
    .attr("y2", d => d.target.y);

  linkLabel
    .attr("x", d => (d.source.x + d.target.x) / 2)
    .attr("y", d => (d.source.y + d.target.y) / 2 - 5);

  node.attr("transform", d => `translate(${d.x},${d.y})`);
}

simulation.on("tick", updatePositions);

// 所有元素创建完毕，手动定位到预热后的位置
updatePositions();
// 极低能量重启，约 0.4 秒收尾，交叉线已在预热中消除
simulation.alpha(0.02).restart();

// ============================================================
// 交互处理
// ============================================================
const tooltip = d3.select("#tooltip");
const detailPanel = d3.select("#detailPanel");
const detailName = d3.select("#detailName");
const detailInfo = d3.select("#detailInfo");
const detailRelations = d3.select("#detailRelations");

let selectedNode = null;

function handleMouseEnter(event, d) {
  tooltip
    .classed("visible", true)
    .html(`
      <div class="tt-name">${d.id}</div>
      <div class="tt-info">
        ${d.tb ? '<span style="background:#fdf6ec;padding:1px 6px;border-radius:3px;border:1px solid #d4a017;margin-right:4px;">' + d.tb + '</span>' : ''}
        ${d.desc}<br>
        <span style="color:#9b8870;">${categoryNames[d.cat]}${d.gen ? ' · 第'+d.gen+'代' : ''}</span>
      </div>
    `);
}

function handleMouseLeave(event, d) {
  tooltip.classed("visible", false);
}

function handleNodeClick(event, d) {
  event.stopPropagation();
  simulation.stop(); // 点击即停，消除残存飘动

  // 清除所有节点的悬停预览状态（避免点击后残留高亮边框）
  node.select("circle")
    .interrupt()
    .attr("r", n => nodeRadius(n))
    .attr("stroke", n => {
      if (n.tb === "正册") return "#d4a017";
      if (n.tb === "副册") return "#a07848";
      if (n.tb === "又副册") return "#8b5e4b";
      return d3.color(categoryColors[n.cat]).darker(0.5).toString();
    })
    .attr("stroke-width", n => {
      if (n.tb === "正册") return 3;
      if (n.tb === "副册") return 2.5;
      if (n.tb === "又副册") return 2;
      return 1.5;
    });

  // 清除之前的选中状态
  if (selectedNode && selectedNode !== d) {
    resetHighlight();
  }

  if (selectedNode === d) {
    // 再次点击取消选中
    resetHighlight();
    selectedNode = null;
    detailPanel.classed("visible", false);
    return;
  }

  selectedNode = d;

  // 找到相关节点和边
  const relatedNodeIds = new Set([d.id]);
  const relatedLinks = [];

  links.forEach(l => {
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    if (sid === d.id || tid === d.id) {
      relatedNodeIds.add(sid);
      relatedNodeIds.add(tid);
      relatedLinks.push(l);
    }
  });

  // 高亮
  svg.classed("dimmed", true);
  node.each(function(n) {
    if (relatedNodeIds.has(n.id)) {
      d3.select(this).classed("highlighted", true);
    }
  });
  link.each(function(l) {
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    if (sid === d.id || tid === d.id) {
      d3.select(this).classed("highlighted", true);
      linkLabel.filter(ld => ld === l).style("opacity", 1);
    }
  });

  // 显示详情面板
  detailPanel.classed("visible", true);
  detailName.text(d.id);
  detailInfo.html(`
    <span>${categoryNames[d.cat]}</span>
    ${d.gen ? '<span>第' + d.gen + '代</span>' : ''}
    ${d.tb ? '<span style="border-color:#d4a017;">' + d.tb + '</span>' : ''}
    <br><small style="color:#9b8870;">${d.desc}</small>
  `);

  // 列出相关人物
  const relatedPeople = [];
  relatedLinks.forEach(l => {
    const sid = typeof l.source === 'object' ? l.source.id : l.source;
    const tid = typeof l.target === 'object' ? l.target.id : l.target;
    const other = sid === d.id ? tid : sid;
    if (!relatedPeople.find(p => p.id === other)) {
      relatedPeople.push({ id: other, relation: sid === d.id ? l.type + '→' : '←' + l.type });
    }
  });

  detailRelations.html(`
    <div style="font-weight:600;color:#8b0000;margin-bottom:6px;">关联人物</div>
    ${relatedPeople.map(p => `
      <div class="relation-item" data-id="${p.id}">
        <span style="color:#9b8870;">${p.relation}</span> ${p.id}
      </div>
    `).join('')}
  `);

  // 关联人物悬停预览
  detailPanel.selectAll(".relation-item")
    .on("mouseenter", function() {
      const targetNode = nodes.find(n => n.id === this.dataset.id);
      if (!targetNode || isNodeHidden(targetNode)) return;
      node.filter(n => n.id === targetNode.id)
        .select("circle")
        .interrupt()
        .transition().duration(150)
        .attr("r", d => nodeRadius(d) + 4)
        .attr("stroke", "#00bcd4")
        .attr("stroke-width", 3.5);
    })
    .on("mouseleave", function() {
      const targetNode = nodes.find(n => n.id === this.dataset.id);
      if (!targetNode) return;
      node.filter(n => n.id === targetNode.id)
        .select("circle")
        .interrupt()
        .transition().duration(150)
        .attr("r", d => nodeRadius(d))
        .attr("stroke", d => {
          if (d.tb === "正册") return "#d4a017";
          if (d.tb === "副册") return "#a07848";
          if (d.tb === "又副册") return "#8b5e4b";
          return d3.color(categoryColors[d.cat]).darker(0.5).toString();
        })
        .attr("stroke-width", d => {
          if (d.tb === "正册") return 3;
          if (d.tb === "副册") return 2.5;
          if (d.tb === "又副册") return 2;
          return 1.5;
        });
    });

  // 点击关联人物：高亮该人物并飞向它
  detailPanel.selectAll(".relation-item").on("click", function(event) {
    const targetId = this.dataset.id;
    const targetNode = nodes.find(n => n.id === targetId);
    if (targetNode) {
      handleNodeClick(event, targetNode);
      const transform = d3.zoomIdentity
        .translate(width/2 - targetNode.x, height/2 - targetNode.y)
        .scale(2);
      svg.transition().duration(600).call(
        d3.zoom().transform, transform
      );
    }
  });

  // 若选中节点被详情面板遮挡，自动平移视图避开
  const t = d3.zoomTransform(svg.node());
  const nodeScreenX = d.x * t.k + t.x;
  const panelZone = width - 300; // 面板约占右侧 280px
  if (nodeScreenX > panelZone) {
    svg.transition().duration(300).call(
      d3.zoom().transform,
      d3.zoomIdentity.translate(t.x - (nodeScreenX - panelZone + 40), t.y).scale(t.k)
    );
  }
}

function resetHighlight() {
  svg.classed("dimmed", false);
  node.classed("highlighted", false);
  link.classed("highlighted", false);
  linkLabel.style("opacity", 0);
}

// 点击空白取消选中
svg.on("click", () => {
  if (selectedNode) {
    resetHighlight();
    selectedNode = null;
    detailPanel.classed("visible", false);
  }
});

// 关闭详情面板
d3.select("#closeDetail").on("click", () => {
  resetHighlight();
  selectedNode = null;
  detailPanel.classed("visible", false);
});

// ============================================================
// 搜索功能
// ============================================================
const searchInput = d3.select("#searchInput");
const clearBtn = d3.select("#clearBtn");

searchInput.on("input", function() {
  const query = this.value.trim();
  if (query) {
    clearBtn.classed("visible", true);
    const match = nodes.find(n => n.id.includes(query) || n.short?.includes(query) || n.desc?.includes(query));
    if (match) {
      handleNodeClick({ stopPropagation: () => {} }, match);
      const transform = d3.zoomIdentity
        .translate(width/2 - match.x, height/2 - match.y)
        .scale(2.5);
      svg.transition().duration(600).call(
        d3.zoom().transform, transform
      );
    }
  } else {
    clearBtn.classed("visible", false);
    resetHighlight();
    selectedNode = null;
    detailPanel.classed("visible", false);
  }
});

clearBtn.on("click", () => {
  searchInput.property("value", "");
  clearBtn.classed("visible", false);
  resetHighlight();
  selectedNode = null;
  detailPanel.classed("visible", false);
});

// 鼠标跟随提示框

// 窗口大小调整

window.addEventListener("resize", () => {
  const w = window.innerWidth;
  const h = window.innerHeight;
  svg.attr("viewBox", [0, 0, w, h]);
  // 更新中心力
  simulation.force("center", d3.forceCenter(w/2, h/2));
  simulation.stop();
});

// 初始缩放，让图谱适应屏幕
setTimeout(() => {
  // 计算所有节点的范围
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  nodes.forEach(n => {
    if (n.x < minX) minX = n.x;
    if (n.x > maxX) maxX = n.x;
    if (n.y < minY) minY = n.y;
    if (n.y > maxY) maxY = n.y;
  });
  const pad = 80;
  const scale = Math.min(width/(maxX - minX + pad*2), height/(maxY - minY + pad*2), 1.8);
  const cx = (minX + maxX) / 2;
  const cy = (minY + maxY) / 2;
  svg.transition().duration(1000).call(
    d3.zoom().transform,
    d3.zoomIdentity.translate(width/2 - cx*scale, height/2 - cy*scale).scale(scale)
  );
}, 2000);

// ============================================================
// 图例交互：点击开关家族，悬停高亮同类节点
// ============================================================
const hiddenCats = new Set();
const hiddenTbs = new Set();
let legendHoverCat = null;

function isNodeHidden(n) {
  return hiddenCats.has(n.cat) || (n.tb && hiddenTbs.has(n.tb));
}

function updateVisibility() {
  node.style("display", n => isNodeHidden(n) ? "none" : null);

  const linkHidden = l => {
    const sid = typeof l.source === "object" ? l.source.id : l.source;
    const tid = typeof l.target === "object" ? l.target.id : l.target;
    const sn = nodes.find(n => n.id === sid);
    const tn = nodes.find(n => n.id === tid);
    return isNodeHidden(sn) || isNodeHidden(tn);
  };
  link.style("display", l => linkHidden(l) ? "none" : null);
  linkHit.style("display", l => linkHidden(l) ? "none" : null);
  linkLabel.style("display", l => linkHidden(l) ? "none" : null);
}

// 图例点击：开关家族/十二钗显示
d3.selectAll(".family-item").on("click", function(event) {
  event.stopPropagation();
  const cat = d3.select(this).attr("data-cat");
  const tb = d3.select(this).attr("data-tb");
  const dot = d3.select(this).select(".legend-dot");

  if (cat) {
    if (hiddenCats.has(cat)) { hiddenCats.delete(cat); dot.classed("hidden", false); }
    else { hiddenCats.add(cat); dot.classed("hidden", true); }
  } else if (tb) {
    if (hiddenTbs.has(tb)) { hiddenTbs.delete(tb); dot.classed("hidden", false); }
    else { hiddenTbs.add(tb); dot.classed("hidden", true); }
  }

  resetHighlight();
  selectedNode = null;
  detailPanel.classed("visible", false);
  updateVisibility();
});

// 图例悬停：高亮该家族/十二钗的全部节点
d3.selectAll(".family-item")
  .on("mouseenter", function() {
    const cat = d3.select(this).attr("data-cat");
    const tb = d3.select(this).attr("data-tb");
    if (cat && hiddenCats.has(cat)) return;
    if (tb && hiddenTbs.has(tb)) return;
    legendHoverCat = cat || tb;

    svg.classed("dimmed", true);
    node.each(function(n) {
      const match = cat ? n.cat === cat : (n.tb === tb);
      if (match && !isNodeHidden(n)) {
        d3.select(this).classed("highlighted", true);
      }
    });
    link.each(function(l) {
      const sid = typeof l.source === "object" ? l.source.id : l.source;
      const tid = typeof l.target === "object" ? l.target.id : l.target;
      const sn = nodes.find(n => n.id === sid);
      const tn = nodes.find(n => n.id === tid);
      const match = cat
        ? (sn?.cat === cat || tn?.cat === cat)
        : (sn?.tb === tb || tn?.tb === tb);
      if (match && !isNodeHidden(sn) && !isNodeHidden(tn)) {
        d3.select(this).classed("highlighted", true);
        linkLabel.filter(ld => ld === l).style("opacity", 1);
      }
    });
  })
  .on("mouseleave", function() {
    legendHoverCat = null;
    svg.classed("dimmed", false);
    node.classed("highlighted", false);
    link.classed("highlighted", false);
    linkLabel.style("opacity", 0);
    // 如果之前有选中节点，恢复其高亮（含标签）
    if (selectedNode) rehighlightNode(selectedNode);
  });

// 恢复节点高亮（图例悬停结束后还原选中状态）
function rehighlightNode(d) {
  const relatedIds = new Set([d.id]);
  links.forEach(l => {
    const sid = typeof l.source === "object" ? l.source.id : l.source;
    const tid = typeof l.target === "object" ? l.target.id : l.target;
    if (sid === d.id || tid === d.id) { relatedIds.add(sid); relatedIds.add(tid); }
  });
  svg.classed("dimmed", true);
  node.each(function(n) {
    if (relatedIds.has(n.id) && !isNodeHidden(n)) {
      d3.select(this).classed("highlighted", true);
    }
  });
  link.each(function(l) {
    const sid = typeof l.source === "object" ? l.source.id : l.source;
    const tid = typeof l.target === "object" ? l.target.id : l.target;
    if ((sid === d.id || tid === d.id) && !isNodeHidden(nodes.find(n => n.id === sid)) && !isNodeHidden(nodes.find(n => n.id === tid))) {
      d3.select(this).classed("highlighted", true);
      linkLabel.filter(ld => ld === l).style("opacity", 1);
    }
  });
}
// ============================================================
// 问情：查找两人物之间的所有关系路径
// ============================================================
function findAllPaths(fromId, toId) {
  if (fromId === toId) return [[{ from: fromId, to: toId, relation: "同一个人" }]];

  // 构建邻接表
  const adj = new Map();
  links.forEach(l => {
    const sid = typeof l.source === "object" ? l.source.id : l.source;
    const tid = typeof l.target === "object" ? l.target.id : l.target;
    if (!adj.has(sid)) adj.set(sid, []);
    if (!adj.has(tid)) adj.set(tid, []);
    adj.get(sid).push({ node: tid, link: l });
    adj.get(tid).push({ node: sid, link: l });
  });
  if (!adj.has(fromId) || !adj.has(toId)) return [];

  // BFS 记录最短距离
  const dist = new Map();
  const queue = [fromId];
  dist.set(fromId, 0);
  while (queue.length) {
    const cur = queue.shift();
    if (cur === toId) continue;
    for (const { node: next } of (adj.get(cur) || [])) {
      if (!dist.has(next)) {
        dist.set(next, dist.get(cur) + 1);
        queue.push(next);
      }
    }
  }
  if (!dist.has(toId)) return [];

  const shortest = dist.get(toId);
  const maxDist = shortest + 3; // 允许比最短多 3 步的备选路径

  // DFS 枚举所有路径（shortest ≤ len ≤ maxDist）
  const allPaths = [];
  const visited = new Set();

  function dfs(cur, nodePath, linkPath) {
    const curLen = nodePath.length - 1;
    if (curLen > maxDist) return;
    if (cur === toId && curLen >= shortest) {
      const steps = [];
      for (let i = 1; i < nodePath.length; i++) {
        steps.push({
          from: nodePath[i - 1],
          to: nodePath[i],
          relation: linkPath[i - 1] ? linkPath[i - 1].type : "",
        });
      }
      allPaths.push(steps);
      if (allPaths.length >= 20) return; // 上限防爆炸
      return;
    }
    visited.add(cur);
    for (const { node: next, link } of (adj.get(cur) || [])) {
      if (visited.has(next)) continue;
      // 剪枝：当前长度 + 1 + next到目标的最短距离 > maxDist 则跳过
      const remainToTarget = dist.has(next) ? (dist.get(toId) - dist.get(next)) : Infinity;
      if (curLen + 1 + remainToTarget > maxDist) continue;
      nodePath.push(next);
      linkPath.push(link);
      dfs(next, nodePath, linkPath);
      linkPath.pop();
      nodePath.pop();
      if (allPaths.length >= 20) break;
    }
    visited.delete(cur);
  }

  dfs(fromId, [fromId], []);

  // 按长度排序，去重
  allPaths.sort((a, b) => a.length - b.length);
  const seen = new Set();
  const unique = [];
  for (const p of allPaths) {
    const key = p.map(s => s.from + "|" + s.relation + "|" + s.to).join(",");
    if (!seen.has(key)) {
      seen.add(key);
      unique.push(p);
    }
  }
  return unique;
}

// 问情 UI
d3.select("#relCalcBtn").on("click", () => {
  const fromName = d3.select("#relFrom").property("value").trim();
  const toName = d3.select("#relTo").property("value").trim();

  if (!fromName || !toName) {
    d3.select("#relResult").classed("visible", true).html('<span style="color:#8b0000;">请输入两个人物名</span>');
    return;
  }

  const fromNode = nodes.find(n => n.id === fromName);
  const toNode = nodes.find(n => n.id === toName);

  if (!fromNode || !toNode) {
    d3.select("#relResult").classed("visible", true).html(
      `<span style="color:#8b0000;">未找到：${!fromNode ? fromName : ""} ${!toNode ? toName : ""}</span>`
    );
    return;
  }

  const allPaths = findAllPaths(fromNode.id, toNode.id);

  if (!allPaths.length) {
    d3.select("#relResult").classed("visible", true).html(
      `<span style="color:#8b0000;">${fromName} 与 ${toName} 之间未寻到情缘</span>`
    );
    resetHighlight();
    selectedNode = null;
    detailPanel.classed("visible", false);
    return;
  }

  // 显示所有路径
  const shortest = allPaths[0].length;
  let html = `<div style="margin-bottom:6px;">${fromName} — ${toName}，寻得 ${allPaths.length} 条情缘</div>`;
  allPaths.forEach((path, idx) => {
    const isShortest = path.length === shortest;
    const tag = isShortest ? '<span style="color:#8b0000;font-weight:600;">[最短]</span> ' : '';
    const steps = path[0].from + " " + path.map(s =>
      `<span class="path-rel">—${s.relation}→</span> ${s.to}`
    ).join(" ");
    html += `<div style="margin:3px 0;${isShortest ? '' : 'color:#9b8870;'}">${tag}${path.length}步：${steps}</div>`;
  });

  d3.select("#relResult").classed("visible", true).html(html);

  // 收集所有路径上的节点和连线
  resetHighlight();
  selectedNode = null;
  detailPanel.classed("visible", false);

  const pathNodeIds = new Set();
  const pathLinkKeys = new Set();
  allPaths.forEach(path => {
    path.forEach(step => {
      pathNodeIds.add(step.from);
      pathNodeIds.add(step.to);
    });
  });
  allPaths.forEach(path => {
    path.forEach(step => {
      links.forEach(l => {
        const sid = typeof l.source === "object" ? l.source.id : l.source;
        const tid = typeof l.target === "object" ? l.target.id : l.target;
        if ((step.from === sid && step.to === tid) || (step.from === tid && step.to === sid)) {
          const key = [sid, tid].sort().join("|");
          pathLinkKeys.add(key);
        }
      });
    });
  });

  svg.classed("dimmed", true);
  node.each(function(n) {
    if (pathNodeIds.has(n.id) && !isNodeHidden(n)) {
      d3.select(this).classed("highlighted", true);
    }
  });
  link.each(function(l) {
    const sid = typeof l.source === "object" ? l.source.id : l.source;
    const tid = typeof l.target === "object" ? l.target.id : l.target;
    const key = [sid, tid].sort().join("|");
    if (pathLinkKeys.has(key) && !isNodeHidden(nodes.find(n => n.id === sid)) && !isNodeHidden(nodes.find(n => n.id === tid))) {
      d3.select(this).classed("highlighted", true);
      linkLabel.filter(ld => ld === l).style("opacity", 1);
    }
  });

  // 飞到路径起点
  const t = d3.zoomTransform(svg.node());
  svg.transition().duration(400).call(
    d3.zoom().transform,
    d3.zoomIdentity.translate(width/2 - fromNode.x * t.k, height/2 - fromNode.y * t.k).scale(t.k)
  );
});

d3.select("#relClearBtn").on("click", () => {
  d3.select("#relFrom").property("value", "");
  d3.select("#relTo").property("value", "");

  svg.classed("dimmed", false);
  selectedNode = null;
  detailPanel.classed("visible", false);
});
